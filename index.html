<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>理論上匹克球｜教練</title>
<!-- v4.5（2026/10/26）：開啟速度比照場主 OA — 一開就帶回 確認上課／課程日誌／不可排日期／教練資料 的資料（init bundle，須搭配 GAS v4.5）；
     頁面底部新增分頁列，切換頁面不必回聊天室點選單（我的課表、我的學員仍是聊天室 Flex 卡片） -->
<!-- v4.4（2026/10/25）：選單「確認上課」→ ?page=confirm 待點名清單（與課堂學員共用 rosterSessions 資料與快取；須搭配 GAS v4.4） -->
<!-- 先建立連線，第一個請求少等一段握手時間 -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
<link rel="preconnect" href="https://api.line.me" crossorigin>
<style>
  :root {
    --green: #1f5f4a; --green-dark: #16463a; --green-light: #e6f0eb;
    --bg: #f5f8f6; --line: #c9d6d0; --text: #222; --muted: #6b7a74;
    --warn: #b4572e; --warn-bg: #fff4ea; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.55;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { background: var(--green); color: #fff; padding: 18px 16px 16px; }
  header .kicker { font-size: 12px; letter-spacing: .15em; opacity: .8; }
  header h1 { margin: 2px 0 0; font-size: 22px; }
  header .back { color: #fff; opacity: .85; font-size: 14px; background: none; border: 0; padding: 0; margin-bottom: 4px; font-family: inherit; }
  main { padding: 16px 16px 120px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; color: var(--green-dark); margin: 0 0 12px; }
  .banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-size: 14px;
    background: var(--green-light); color: var(--green-dark); border-left: 4px solid var(--green); }
  .banner.warn { background: var(--warn-bg); color: #7a3a17; border-left-color: var(--warn); }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label.title { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  label.title .req { color: var(--warn); margin-left: 2px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  input[type=text], input[type=tel], input[type=email], input[type=date], textarea, select {
    width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--text); font-family: inherit; -webkit-appearance: none; appearance: none;
  }
  textarea { min-height: 72px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); }
  .chips.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: block; text-align: center; padding: 9px 10px; border: 1px solid var(--line); border-radius: 999px;
    font-size: 14px; background: #fff; cursor: pointer; user-select: none; }
  .chip input:checked + span { background: var(--green); border-color: var(--green); color: #fff; }
  .chip input:focus-visible + span { outline: 2px solid var(--green-dark); outline-offset: 2px; }
  .error-text { color: var(--warn); font-size: 13px; margin-top: 6px; display: none; }
  .invalid .error-text { display: block; }
  .invalid input, .invalid textarea { border-color: var(--warn); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96); border-top: 1px solid var(--line); }
  .bar-inner { max-width: 560px; margin: 0 auto; }
  button { font-family: inherit; }
  button.primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px; border: 0; border-radius: 12px;
    background: var(--green); color: #fff; }
  button.primary:disabled { opacity: .55; }
  button.ghost { width: 100%; font-size: 15px; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--green-dark); }
  button.link { border: 0; background: none; color: var(--warn); font-size: 14px; padding: 4px 0; }
  .center { text-align: center; padding: 48px 16px; }
  .center .big { font-size: 20px; font-weight: 700; color: var(--green-dark); margin: 12px 0 8px; }
  .center p { color: var(--muted); margin: 0 0 4px; font-size: 15px; }
  .spinner { width: 36px; height: 36px; margin: 0 auto; border: 3px solid var(--green-light); border-top-color: var(--green);
    border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check { width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; background: var(--green); color: #fff; font-size: 30px; line-height: 56px; }
  .hidden { display: none !important; }
  .code { font-size: 12px; color: var(--muted); margin-top: 16px; word-break: break-all; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 4px 8px; letter-spacing: .05em; }
  .item { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px; color: var(--text); font-size: 15px; }
  .item:active { background: var(--green-light); }
  .item .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; color: var(--green-dark); }
  .item .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .item .tag { font-size: 12px; color: var(--warn); font-weight: 600; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 18px 8px; background: #fff;
    border: 1px dashed var(--line); border-radius: var(--radius); }
  .session-head { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
  .session-head .t { font-weight: 700; color: var(--green-dark); font-size: 16px; }
  .session-head .s { font-size: 13px; color: var(--muted); }
  .stu { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; background: #fbfdfc; }
  .stu-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .stu-head b { color: var(--green-dark); }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .row2 > * { min-width: 0; }
  input[type=date] { min-width: 0; max-width: 100%; display: block; min-height: 44px; }
  /* 課堂學員 */
  .prev { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
  .prev .h { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .prev .k { font-weight: 700; color: var(--green-dark); }
  .prev p { margin: 4px 0 0; white-space: pre-wrap; }
  details.sc { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; }
  details.sc > summary { list-style: none; padding: 12px 14px; cursor: pointer; }
  details.sc > summary::-webkit-details-marker { display: none; }
  details.sc[open] > summary { border-bottom: 1px solid var(--green-light); }
  .sc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sc-name { font-weight: 700; color: var(--green-dark); font-size: 16px; }
  .sc-level { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .sc-arrow { color: var(--muted); font-size: 13px; white-space: nowrap; }
  details.sc[open] .sc-arrow { transform: rotate(90deg); display: inline-block; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--green-light); color: var(--green-dark); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  .pill.grey { background: #eef1ef; color: var(--muted); }
  .sc-body { padding: 10px 14px 14px; font-size: 14px; }
  .sc-att { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .note { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 8px; }
  .note:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .note .m { font-size: 12px; color: var(--muted); }
  .note .l { margin-top: 2px; white-space: pre-wrap; }
  .note .l b { color: var(--green-dark); font-weight: 600; }
  .sc-actions { margin-top: 12px; }
  .sc-actions button { padding: 9px; font-size: 14px; }
  .pill.ok { background: var(--green); color: #fff; }
  .bar-inner.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bar-inner.two button { padding: 13px 8px; font-size: 15px; }
  /* 確認上課 */
  .att { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .att.unset { border-color: var(--warn); }
  .att-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .att-name { font-weight: 700; color: var(--green-dark); font-size: 16px; }
  .att-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .att-meta.in { color: var(--green); font-weight: 600; }
  .att .chip span { padding: 8px 6px; }
  .summary { font-size: 14px; color: var(--muted); margin: 6px 4px 10px; }
  .conflict { margin: 6px 0 0; padding-left: 18px; }
  /* v4.1：先顯示上次的資料（更新中，按鈕暫停），新資料到了再換上 */
  header { position: relative; }
  .sync { position: absolute; right: 16px; top: 18px; font-size: 12px; background: rgba(255,255,255,.18); color: #fff;
    padding: 3px 10px; border-radius: 999px; }
  body.stale main button:not(.item), body.stale main input, body.stale main textarea, body.stale main select,
  body.stale main .chip, body.stale .bar button { pointer-events: none; opacity: .55; }
  .sk { padding: 16px; max-width: 560px; margin: 0 auto; }
  .sk div { background: linear-gradient(90deg, #e9efec 25%, #f4f7f5 50%, #e9efec 75%); background-size: 200% 100%;
    animation: sk 1.2s ease-in-out infinite; border-radius: var(--radius); margin-bottom: 10px; }
  .sk .a { height: 64px; } .sk .b { height: 76px; } .sk .c { height: 16px; width: 40%; border-radius: 6px; }
  @keyframes sk { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sk div { animation: none; } }
  /* v4.5：頁面底部分頁列（確認上課／課程日誌／不可排日期／教練資料）；送出列放在分頁列上方 */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; background: #fff; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; min-width: 0; height: 45px; border: 0; background: none; padding: 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; font-family: inherit; }
  .tabbar button.on { color: var(--green-dark); box-shadow: inset 0 3px 0 var(--green); }
  body.has-tabs .bar { bottom: calc(44px + env(safe-area-inset-bottom)); padding-bottom: 12px; }
  body.has-tabs main { padding-bottom: 170px; }
  body.has-tabs .toast { bottom: calc(140px + env(safe-area-inset-bottom)); }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #16463a; color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 9; max-width: 90%; }
</style>
</head>
<body>

<header>
  <button class="back hidden" id="btnBack" type="button">‹ 返回</button>
  <div class="kicker">理論上匹克球｜教練</div>
  <h1 id="pageTitle">教練</h1>
  <span class="sync hidden" id="syncPill">更新中…</span>
</header>
<div class="toast hidden" id="toast" role="status"></div>
<!-- v4.5：分頁列（在職教練才顯示） -->
<nav id="tabbar" class="tabbar hidden">
  <button type="button" data-tab="confirm">確認上課</button>
  <button type="button" data-tab="journal">課程日誌</button>
  <button type="button" data-tab="unavailable">不可排日期</button>
  <button type="button" data-tab="profile">教練資料</button>
</nav>

<!-- 共用：載入中／錯誤 -->
<section id="viewLoading" class="sk" aria-label="載入中">
  <div class="c"></div><div class="a"></div><div class="b"></div><div class="b"></div><div class="b"></div>
</section>
<section id="viewError" class="center hidden">
  <div class="big">無法開啟</div>
  <p id="errorMsg">請關閉頁面後再試一次。</p>
  <div class="code" id="errorCode"></div>
  <div style="max-width:320px;margin:20px auto 0"><button class="ghost" onclick="location.reload()">重新載入</button></div>
</section>
<section id="viewDone" class="center hidden">
  <div class="check">✓</div>
  <div class="big" id="doneTitle">已送出</div>
  <p id="doneMsg"></p>
  <div style="max-width:320px;margin:24px auto 0">
    <button class="primary hidden" id="btnDoneNext" type="button"></button>
    <button class="ghost" style="margin-top:10px" onclick="closeLiff()">關閉</button>
  </div>
</section>

<!-- ============ 教練資料 ============ -->
<main id="viewProfile" class="hidden">
  <div id="profileBanner" class="banner"></div>
  <div class="card">
    <h2>基本資料</h2>
    <div class="field" data-field="姓名">
      <label class="title" for="p_name">姓名<span class="req">*</span></label>
      <input type="text" id="p_name" maxlength="30" autocomplete="name">
      <div class="error-text">請填寫姓名</div>
    </div>
    <div class="field" data-field="電話">
      <label class="title" for="p_phone">手機<span class="req">*</span></label>
      <input type="tel" id="p_phone" inputmode="numeric" maxlength="12" placeholder="0912345678" autocomplete="tel">
      <div class="error-text">請填寫正確的電話，例如 0912345678</div>
    </div>
    <div class="field" data-field="Email">
      <label class="title" for="p_email">Email</label>
      <input type="email" id="p_email" maxlength="100" placeholder="name@gmail.com" autocomplete="email">
      <div class="error-text">Email 格式不正確</div>
    </div>
  </div>
  <div class="card">
    <h2>教學資料</h2>
    <div class="field">
      <label class="title" for="p_cert">證照</label>
      <textarea id="p_cert" maxlength="500" placeholder="例：PPR Level 1、USAPA 認證…"></textarea>
    </div>
    <div class="field">
      <label class="title">可教程度</label>
      <div class="chips" id="p_levels"></div>
      <div class="hint">可複選</div>
    </div>
    <div class="field">
      <label class="title" for="p_skill">擅長項目</label>
      <textarea id="p_skill" maxlength="500" placeholder="例：新手入門、雙打戰術、發球"></textarea>
    </div>
    <div class="field">
      <label class="title">可排課時段</label>
      <div class="chips grid3" id="p_slots"></div>
      <div class="hint">可複選</div>
    </div>
  </div>
  <div class="bar"><div class="bar-inner"><button class="primary" id="btnProfile" type="button">送出</button></div></div>
</main>

<!-- ============ 課程日誌：清單 ============ -->
<main id="viewJournalList" class="hidden">
  <div class="section-title">待寫日誌</div>
  <div id="jl_pending"></div>
  <div class="section-title" id="jl_writtenTitle">已寫，可修改</div>
  <div id="jl_written"></div>
</main>

<!-- ============ 課程日誌：表單 ============ -->
<main id="viewJournalForm" class="hidden">
  <div id="jf_banner" class="banner hidden"></div>
  <div class="session-head">
    <div class="t" id="jf_title"></div>
    <div class="s" id="jf_sub"></div>
  </div>
  <div class="card">
    <h2>班級整體紀錄</h2>
    <div class="field" data-field="教學主題">
      <label class="title" for="jf_topic">教學主題<span class="req">*</span></label>
      <input type="text" id="jf_topic" maxlength="100" placeholder="例：反手切球、第三拍落點">
      <div class="error-text">請填寫教學主題</div>
    </div>
    <div class="field" id="jf_methodField">
      <label class="title">訓練方式</label>
      <div class="chips" id="jf_method"></div>
    </div>
    <div class="field">
      <label class="title" for="jf_done">完成內容</label>
      <textarea id="jf_done" maxlength="1000"></textarea>
    </div>
    <div class="field">
      <label class="title" for="jf_overall">班級整體狀況</label>
      <textarea id="jf_overall" maxlength="1000"></textarea>
    </div>
    <div class="field">
      <label class="title" for="jf_next">下堂課建議</label>
      <textarea id="jf_next" maxlength="1000"></textarea>
    </div>
    <div class="field">
      <label class="title" for="jf_handover">交接注意事項</label>
      <textarea id="jf_handover" maxlength="1000" placeholder="下一位教練需要注意什麼"></textarea>
    </div>
    <div class="field">
      <label class="title" for="jf_special">特殊狀況</label>
      <textarea id="jf_special" maxlength="1000" placeholder="受傷、場地問題等（沒有可留白）"></textarea>
    </div>
  </div>
  <div class="card">
    <h2>需要特別注意的學員</h2>
    <div class="hint" style="margin:-6px 0 12px">只需要填有狀況的學員，不用每個人都寫。</div>
    <div id="jf_students"></div>
    <div class="row2">
      <select id="jf_pick" aria-label="選擇學員"></select>
      <button class="ghost" id="btnAddStu" type="button" style="padding:10px">＋ 加入</button>
    </div>
    <div class="hint" id="jf_rosterHint"></div>
  </div>
  <div class="bar"><div class="bar-inner"><button class="primary" id="btnJournal" type="button">送出日誌</button></div></div>
</main>

<!-- ============ 課堂學員：清單（沒指定課堂時） ============ -->
<main id="viewRosterList" class="hidden">
  <div class="hint" style="margin:0 4px 10px">點一堂課，查看這堂的學員與最近紀錄。</div>
  <div id="rl_list"></div>
</main>

<!-- ============ v4.4：確認上課清單（選單「確認上課」） ============ -->
<main id="viewConfirmList" class="hidden">
  <div class="hint" style="margin:0 4px 10px" id="cl_hint">點一堂課開始點名；學員掃 QR 到場的會先標好「出席」。</div>
  <div id="cl_list"></div>
</main>

<!-- ============ 課堂學員 ============ -->
<main id="viewRoster" class="hidden">
  <div class="session-head">
    <div class="t" id="r_title"></div>
    <div class="s" id="r_sub"></div>
  </div>
  <div id="r_prev"></div>
  <div class="section-title" id="r_count">學員</div>
  <div id="r_students"></div>
  <div class="bar hidden" id="r_bar"><div class="bar-inner" id="r_barInner">
    <button class="primary" id="btnRosterConfirm" type="button"></button>
    <button class="primary" id="btnRosterJournal" type="button"></button>
  </div></div>
</main>

<!-- ============ 確認上課（點名） ============ -->
<main id="viewConfirm" class="hidden">
  <div id="c_banner" class="banner hidden"></div>
  <div class="session-head">
    <div class="t" id="c_title"></div>
    <div class="s" id="c_sub"></div>
  </div>
  <div class="hint" id="c_hint" style="margin:0 4px 10px"></div>
  <div id="c_list"></div>
  <button class="ghost" id="btnAllPresent" type="button">未選的學員全部設為出席</button>
  <div class="summary" id="c_summary"></div>
  <div class="bar"><div class="bar-inner"><button class="primary" id="btnConfirm" type="button">確認上課</button></div></div>
</main>

<!-- ============ 不可排日期 ============ -->
<main id="viewUnavail" class="hidden">
  <div id="u_warn" class="banner warn hidden"></div>
  <div class="card">
    <h2>新增不可排日期</h2>
    <div class="row2">
      <div class="field" data-field="開始">
        <label class="title" for="u_start">開始日期<span class="req">*</span></label>
        <input type="date" id="u_start">
      </div>
      <div class="field" data-field="結束">
        <label class="title" for="u_end">結束日期</label>
        <input type="date" id="u_end">
      </div>
    </div>
    <div class="error-text" id="u_error" style="margin:-6px 0 10px"></div>
    <div class="field">
      <label class="title" for="u_reason">原因</label>
      <input type="text" id="u_reason" maxlength="200" placeholder="例：出國、比賽">
    </div>
    <button class="primary" id="btnUnavail" type="button">新增</button>
  </div>
  <div class="section-title">已登記（今天以後）</div>
  <div id="u_list"></div>
</main>

<script>
// ================================================================
// 設定：建置手冊第 09 節
// ================================================================
const LIFF_ID = '請填入教練 LIFF ID';          // 例：2001234567-AbCdEfGh
const GAS_URL = '請填入 GAS 網頁應用程式網址';  // https://script.google.com/macros/s/…/exec
const SHOW_ERROR_CODE = true;                    // 測試期間顯示錯誤代碼；上線後改為 false

// ================================================================
// 共用
// ================================================================
const $ = (id) => document.getElementById(id);
const VIEWS = ['viewLoading', 'viewError', 'viewDone', 'viewProfile', 'viewJournalList', 'viewJournalForm', 'viewRosterList', 'viewRoster', 'viewConfirmList', 'viewConfirm', 'viewUnavail'];
const app = { idToken: '', page: 'profile', backTo: null, nav: 0, early: false };

function show(view, title) {
  VIEWS.forEach((v) => $(v).classList.toggle('hidden', v !== view));
  syncTabbar(view);
  if (title) { $('pageTitle').textContent = title; document.title = title + '｜理論上匹克球'; }
  window.scrollTo(0, 0);
}
function setBack(fn) {
  app.backTo = fn;
  $('btnBack').classList.toggle('hidden', !fn);
}
function showError(message, code) {
  setBack(null);
  $('errorMsg').textContent = message || '請關閉頁面後再試一次。';
  $('errorCode').textContent = SHOW_ERROR_CODE && code ? '錯誤代碼：' + code : '';
  show('viewError', '無法開啟');
}
function showDone(title, msg, next) {
  setBack(null);
  $('doneTitle').textContent = title;
  $('doneMsg').textContent = msg;
  const b = $('btnDoneNext');
  b.classList.toggle('hidden', !next);
  if (next) { b.textContent = next.label; b.onclick = next.fn; }
  show('viewDone', title);
}
function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function el(tag, attrs, children) {
  const n = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (k === 'text') n.textContent = v;
    else if (k === 'onclick') n.addEventListener('click', v);
    else n.setAttribute(k, v);
  });
  (children || []).forEach((c) => c && n.appendChild(c));
  return n;
}
function renderChips(container, name, items, selected, type) {
  container.innerHTML = '';
  const set = new Set((selected || []).map(String));
  items.forEach((it) => {
    const value = typeof it === 'object' ? it.id : String(it);
    const label = typeof it === 'object' ? it.name : String(it);
    const input = el('input', { type: type || 'checkbox', name: name, value: value });
    input.checked = set.has(value);
    // 單選也允許再點一次取消
    if (type === 'radio') input.addEventListener('click', () => {
      if (input.dataset.was === '1') { input.checked = false; input.dataset.was = ''; }
      else { container.querySelectorAll('input').forEach((x) => (x.dataset.was = '')); input.dataset.was = '1'; }
    });
    if (input.checked) input.dataset.was = '1';
    container.appendChild(el('label', { class: 'chip' }, [input, el('span', { text: label })]));
  });
}
function checked(container) {
  return Array.from(container.querySelectorAll('input:checked')).map((i) => i.value);
}
function markInvalid(field, bad) {
  const box = document.querySelector('[data-field="' + field + '"]');
  if (box) box.classList.toggle('invalid', bad);
  return box;
}
function normalizePhone(v) {
  let s = String(v || '').replace(/\D/g, '');
  if (s.length === 9 && s.charAt(0) === '9') s = '0' + s;
  return s;
}

// ================================================================
// 請求與快取（v4.1）
//   1. 頁面一打開就用上次存下的 ID Token 送出請求，不必等 LIFF 初始化（Token 快過期時才等）
//   2. 每一頁先畫出上次的資料（右上角顯示「更新中…」，按鈕暫停），新資料到了再換上
//   3. 30 秒內在頁面之間來回，直接用記憶中的資料，不再請求
//   4. 送出後，GAS 直接回傳要回去那一頁的資料
// ================================================================
const LS = 'coachOA:';
const store = {
  get(k, maxAgeMs) {
    try {
      const v = JSON.parse(localStorage.getItem(LS + k) || 'null');
      return v && Date.now() - v.t < (maxAgeMs || 7 * 864e5) ? v.d : null;
    } catch (e) { return null; }
  },
  set(k, d) {
    try { localStorage.setItem(LS + k, JSON.stringify({ t: Date.now(), d: d })); } catch (e) { /* 空間不足或無痕模式：略過 */ }
  },
  del(k) {
    try { localStorage.removeItem(LS + k); } catch (e) { /* 略過 */ }
  },
};
const MEM_MS = 30000;
const TAB_MS = 120000; // v4.5：選單頁（bundle 帶回的）2 分鐘內切換直接用記憶中的資料
const BUNDLE_KEYS = ['profile', 'rlist', 'jlist', 'unavail'];
const mem = {};
function remember(key, d) {
  mem[key] = { t: Date.now(), d: d };
  store.set('v:' + key, d);
}
function recall(key) {
  const m = mem[key];
  return m && Date.now() - m.t < (BUNDLE_KEYS.indexOf(key) >= 0 ? TAB_MS : MEM_MS) ? m.d : null;
}

// ---- v4.5：開頁一次 init（bundle）帶回所有選單頁 ----
function startBoot() {
  app.boot = callGas({ action: 'init', bundle: true }).then((r) => {
    if (r && r.ok) {
      app.status = r.status;
      const pages = r.pages || {};
      remember('profile', Object.assign({}, r, { pages: null }));
      Object.keys(pages).forEach((k) => { if (pages[k] && pages[k].ok !== false) remember(k, pages[k]); });
      syncTabbar(app.view);
    }
    return r;
  });
  app.boot.then(() => (app.boot = null), () => (app.boot = null));
}
/** 選單頁的資料：bundle 還在路上就等它；bundle 沒帶到（出錯、非在職）才自己讀 */
async function fromBoot(key, payload) {
  const b = await app.boot;
  if (key === 'profile') return b;
  const p = b && b.ok && b.pages ? b.pages[key] : null;
  if (p && p.ok !== false) return p;
  return callGas(payload);
}

// ---- v4.5：分頁列 ----
const TAB_VIEWS = { viewConfirmList: 'confirm', viewJournalList: 'journal', viewUnavail: 'unavailable', viewProfile: 'profile' };
function coachActive() {
  if (app.status) return app.status === 'active';
  const p = store.get('v:profile');
  return !!(p && p.status === 'active');
}
function syncTabbar(view) {
  app.view = view;
  const tab = TAB_VIEWS[view];
  const on = !!(tab && coachActive());
  $('tabbar').classList.toggle('hidden', !on);
  document.body.classList.toggle('has-tabs', on);
  if (on) $('tabbar').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
}
$('tabbar').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-tab]');
  if (!b) return;
  if (b.classList.contains('on')) return window.scrollTo({ top: 0, behavior: 'smooth' });
  route({ page: b.dataset.tab });
});
function forget(keys) {
  keys.forEach((k) => delete mem[k]);
}

// ---- LIFF SDK 非同步載入；ID Token 先用上次的 ----
const sdkReady = new Promise((resolve, reject) => {
  const s = document.createElement('script');
  s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
  s.charset = 'utf-8';
  s.onload = resolve;
  s.onerror = () => reject(new Error('SDK_LOAD_FAILED'));
  document.head.appendChild(s);
});
let readyResolve;
app.ready = new Promise((r) => (readyResolve = r)); // LIFF 初始化完成、拿到新的 ID Token

function savedToken() {
  const t = store.get('tok', 864e5);
  return t && t.exp - Date.now() > 5 * 60000 ? t.token : ''; // 至少還有 5 分鐘才用
}

/** 呼叫 GAS：不設定 Content-Type（text/plain），避免 CORS 預檢 */
async function callGas(payload, timeoutMs) {
  if (!app.idToken) await app.ready;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 20000);
  try {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ idToken: app.idToken }, payload)), signal: ctrl.signal });
    const text = await res.text();
    let r;
    try { r = JSON.parse(text); } catch (e) { throw new Error('NON_JSON'); }
    // 先用的舊 Token 被拒 → 等 LIFF 給新的再送一次
    if (!r.ok && r.error === 'AUTH_FAILED' && app.early) {
      app.early = false;
      app.idToken = '';
      store.del('tok');
      return callGas(payload, timeoutMs);
    }
    return r;
  } finally {
    clearTimeout(timer);
  }
}

function setStale(on) {
  document.body.classList.toggle('stale', on);
  $('syncPill').classList.toggle('hidden', !on);
}
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 3000);
}

/**
 * 開啟一頁
 *   key：快取鍵｜payload：要送給 GAS 的內容｜render(d)：畫面
 *   回傳最新資料；中途切到別頁則回傳 null 且不畫
 */
async function view(key, payload, render) {
  const nav = ++app.nav;
  const hot = recall(key);
  if (hot) {
    setStale(false);
    render(hot);
    return hot;
  }
  const snap = store.get('v:' + key);
  if (snap) {
    setStale(true);
    try { render(snap); } catch (e) { show('viewLoading'); } // 舊格式的快照畫不出來就算了
  } else {
    setStale(false);
    show('viewLoading');
  }
  let r;
  try {
    r = app.boot && BUNDLE_KEYS.indexOf(key) >= 0 ? await fromBoot(key, payload) : await callGas(payload); // v4.5
  } catch (e) {
    if (nav !== app.nav) return null;
    setStale(false);
    if (snap) { toast('連線不穩定，畫面是上次的資料'); document.body.classList.add('stale'); return null; }
    showError('連線逾時，請稍後再試。', e.name === 'AbortError' ? 'TIMEOUT' : e.message);
    return null;
  }
  if (nav !== app.nav) return null;
  setStale(false);
  if (!r.ok) {
    store.del('v:' + key);
    showError(r.message || '載入失敗，請稍後再試。', r.error);
    return null;
  }
  remember(key, r);
  render(r);
  return r;
}

/**
 * 寫入用：同一個 submissionId 最多送兩次（GAS 不會重複寫入）
 * 回傳 { ok, data } 或 { ok:false, message, uncertain }
 */
async function send(button, payload) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = '送出中…';
  let last = '';
  try {
    for (let i = 0; i < 2; i++) {
      try {
        const r = await callGas(payload, 20000);
        if (r.ok) return { ok: true, data: r };
        if (r.error !== 'BUSY') return { ok: false, message: (r.message || '送出失敗') + (SHOW_ERROR_CODE ? '（' + r.error + '）' : '') };
        last = 'BUSY';
      } catch (e) {
        last = e.name === 'AbortError' ? 'TIMEOUT' : e.message;
      }
    }
    return { ok: false, uncertain: true, message: '連線不穩定，資料可能已經送出。請稍後重新開啟確認；沒有更新的話再送一次即可（不會重複）。' + (SHOW_ERROR_CODE ? '（' + last + '）' : '') };
  } finally {
    button.disabled = false;
    button.textContent = label;
  }
}

function banner(id, text, warn) {
  const b = $(id);
  b.textContent = text;
  b.className = 'banner' + (warn ? ' warn' : '');
  b.classList.toggle('hidden', !text);
  if (text) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeLiff() {
  if (window.liff && liff.isInClient && liff.isInClient()) liff.closeWindow();
  else window.close();
}

$('btnBack').addEventListener('click', () => app.backTo && app.backTo());
document.addEventListener('input', (e) => {
  const box = e.target.closest && e.target.closest('[data-field]');
  if (box) box.classList.remove('invalid');
});

// ================================================================
// 教練資料
// ================================================================
const PROFILE_STATUS = {
  new: '第一次填寫：送出後由管理員審核，通過後會在聊天室通知你，並開放教練選單。',
  pending: '你的資料正在審核中，可以修改後重新送出。',
  active: '你已是在職教練，可以隨時更新資料。',
  staff: '你已是團隊成員，送出後管理員會確認是否加上教練身分。',
  inactive: '你的帳號目前不是在職狀態，送出後由管理員確認。',
};
const profile = { submissionId: newId() };

function openProfile() {
  setBack(null);
  return view('profile', { action: 'init' }, renderProfile);
}

function renderProfile(d) {
  if (d.status) app.status = d.status; // v4.5：分頁列只給在職教練
  profile.submissionId = newId();
  const c = d.coach || {};
  $('p_name').value = c.姓名 || (d.profile && d.profile.name) || '';
  $('p_phone').value = c.電話 || '';
  $('p_email').value = c.Email || '';
  $('p_cert').value = c.證照 || '';
  $('p_skill').value = c.擅長項目 || '';
  renderChips($('p_levels'), 'level', d.levels || [], c.可教程度);
  renderChips($('p_slots'), 'slot', d.slots || [], c.可排課時段);
  banner('profileBanner', PROFILE_STATUS[d.status] || PROFILE_STATUS.new, d.status === 'inactive');
  $('btnProfile').textContent = d.status === 'new' ? '送出審核' : '儲存修改';
  show('viewProfile', d.status === 'new' ? '填寫教練資料' : '教練資料');
}

$('btnProfile').addEventListener('click', async () => {
  const form = {
    姓名: $('p_name').value.trim(),
    電話: normalizePhone($('p_phone').value),
    Email: $('p_email').value.trim().toLowerCase(),
    證照: $('p_cert').value.trim(),
    擅長項目: $('p_skill').value.trim(),
    可教程度: checked($('p_levels')),
    可排課時段: checked($('p_slots')),
  };
  const emailBad = !!form.Email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.Email);
  const checks = { 姓名: !form.姓名, 電話: !/^0\d{8,9}$/.test(form.電話), Email: emailBad };
  const bad = Object.keys(checks).filter((k) => { markInvalid(k, checks[k]); return checks[k]; });
  if (bad.length) { document.querySelector('[data-field="' + bad[0] + '"]').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }

  const r = await send($('btnProfile'), { action: 'save', submissionId: profile.submissionId, form: form });
  if (!r.ok) {
    if (r.uncertain) return showDone('可能已送出', r.message);
    return banner('profileBanner', r.message, true);
  }
  const msg = {
    pending: r.data.isNew ? '管理員審核通過後，會在聊天室通知你，並開放教練選單。' : '資料已更新，仍在審核中。',
    active: '資料已更新。',
    staff: '資料已更新，管理員會確認是否加上教練身分。',
    inactive: '資料已送出，管理員會與你聯繫。',
  };
  forget(['profile']);
  store.del('v:profile');
  showDone(r.data.isNew ? '已送出審核' : '已儲存', msg[r.data.status] || '資料已送出。');
});

// ================================================================
// 課程日誌
// ================================================================
const journal = { sessionId: '', submissionId: '', roster: [], options: {}, students: [] };

function openJournalList() {
  setBack(null);
  return view('jlist', { action: 'journalList' }, renderJournalList);
}

function renderJournalList(d) {
  setBack(null);
  const pending = $('jl_pending');
  const written = $('jl_written');
  pending.innerHTML = '';
  written.innerHTML = '';
  if (!d.pending.length) pending.appendChild(el('div', { class: 'empty', text: '最近 14 天的課都寫完了 👍' }));
  d.pending.forEach((s) => pending.appendChild(sessionItem(s, s.confirmed ? '' : '未點名')));
  $('jl_writtenTitle').textContent = '已寫，可修改（送出後 ' + d.editDays + ' 天內）';
  if (!d.written.length) written.appendChild(el('div', { class: 'empty', text: '目前沒有可修改的日誌' }));
  d.written.forEach((s) => written.appendChild(sessionItem(s, (s.confirmed ? '' : '未點名・') + '修改至 ' + s.editUntil, s.topic)));
  show('viewJournalList', '課程日誌');
}

function sessionItem(s, tag, extra, onClick) {
  return el('button', { class: 'item', type: 'button', onclick: onClick || (() => openJournalForm(s.id)) }, [
    el('div', { class: 'top' }, [
      el('span', { text: s.dateText + ' ' + s.start + (s.end ? '–' + s.end : '') }),
      tag ? el('span', { class: 'tag', text: tag }) : null,
    ]),
    el('div', { text: s.className || '（未命名班級）' }),
    el('div', { class: 'sub', text: [s.place || s.venue, s.lesson ? '第 ' + s.lesson + ' 堂' : '', s.pendingClass ? '待成班' : '', extra ? '主題：' + extra : ''].filter(Boolean).join('・') }),
  ]);
}

/**
 * opt.preselect：開啟後直接加入這位學員的個別紀錄（從課堂學員頁進來時）
 * opt.back：返回鍵與送出後要回到的頁面（預設回日誌清單）
 */
function openJournalForm(sessionId, opt) {
  opt = opt || {};
  // 從課堂學員頁進來：資料已經一起帶來，不必請求
  if (opt.data) {
    app.nav++;
    setStale(false);
    renderJournalForm(sessionId, opt, opt.data);
    return;
  }
  return view('j:' + sessionId, { action: 'journalGet', sessionId: sessionId }, (d) => renderJournalForm(sessionId, opt, d));
}

function renderJournalForm(sessionId, opt, d) {
  journal.back = opt.back || { label: '回到日誌清單', fn: openJournalList, returnTo: 'list' };
  journal.sessionId = sessionId;
  journal.submissionId = newId();
  journal.roster = d.roster;
  journal.options = d.options;
  journal.students = [];
  $('jf_students').innerHTML = '';
  markInvalid('教學主題', false);

  const s = d.session;
  $('jf_title').textContent = s.dateText + ' ' + s.start + (s.end ? '–' + s.end : '') + '　' + (s.className || '');
  $('jf_sub').textContent = [s.tag, s.place || s.venue, s.lesson ? '第 ' + s.lesson + ' 堂' : '', '學員 ' + d.roster.length + ' 人'].filter(Boolean).join('・');

  const j = d.journal || {};
  $('jf_topic').value = j.教學主題 || '';
  $('jf_done').value = j.完成內容 || '';
  $('jf_overall').value = j.班級整體狀況 || '';
  $('jf_next').value = j.下堂課建議 || '';
  $('jf_handover').value = j.交接注意事項 || '';
  $('jf_special').value = j.特殊狀況 || '';
  const methods = d.options.trainingMethods || [];
  $('jf_methodField').classList.toggle('hidden', !methods.length);
  renderChips($('jf_method'), 'method', methods, j.訓練方式 ? [j.訓練方式] : [], 'radio');

  journal.confirmState = d.confirmState;
  const notes = [];
  if (d.journal) notes.push('修改已送出的日誌，可修改至 ' + j.editUntil + '。');
  if (d.confirmState === 'confirm') notes.push('這堂還沒有確認上課（點名），送出日誌後請接著確認，系統才會扣堂。');
  banner('jf_banner', notes.join('\n'), d.confirmState === 'confirm');
  $('jf_banner').style.whiteSpace = 'pre-line';
  (d.individuals || []).forEach((i) => addStudentCard(i));
  let focusCard = null;
  if (opt.preselect && d.roster.some((r) => r.id === opt.preselect)) {
    const existing = journal.students.find((x) => x.學員 === opt.preselect);
    if (!existing) addStudentCard({ 學員: opt.preselect });
    focusCard = (existing || journal.students[journal.students.length - 1]).card;
  }
  refreshPicker();
  $('btnJournal').textContent = d.journal ? '儲存修改' : '送出日誌';
  setBack(journal.back.fn);
  show('viewJournalForm', d.journal ? '修改日誌' : '寫課程日誌');
  if (focusCard) setTimeout(() => focusCard.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
}

function refreshPicker() {
  const pick = $('jf_pick');
  const used = new Set(journal.students.map((x) => x.學員));
  const left = journal.roster.filter((r) => !used.has(r.id));
  pick.innerHTML = '';
  pick.appendChild(el('option', { value: '', text: left.length ? '選擇學員…' : '（已全部加入）' }));
  left.forEach((r) => pick.appendChild(el('option', { value: r.id, text: r.name + (r.level ? '（' + r.level + '）' : '') })));
  pick.disabled = !left.length;
  $('btnAddStu').disabled = !left.length;
  $('jf_rosterHint').textContent = journal.roster.length ? '' : '這一堂目前沒有報名或出缺勤紀錄的學員。';
}

function addStudentCard(data) {
  const r = journal.roster.find((x) => x.id === data.學員) || { name: '（不在名單中）', level: '' };
  const key = newId();
  const entry = { key: key, 紀錄ID: data.紀錄ID || '', 學員: data.學員 };
  journal.students.push(entry);
  const opts = journal.options;
  const mastery = el('div', { class: 'chips grid5' });
  renderChips(mastery, 'm_' + key, opts.mastery || [], data.掌握程度 ? [String(data.掌握程度)] : [], 'radio');
  const advice = el('div', { class: 'chips grid3' });
  renderChips(advice, 'a_' + key, opts.levelAdvice || [], data.程度建議 ? [data.程度建議] : [], 'radio');
  const ta = (ph, v) => { const t = el('textarea', { maxlength: '1000', placeholder: ph }); t.value = v || ''; t.style.minHeight = '56px'; return t; };
  const problem = ta('例：準備姿勢太晚', data.主要問題);
  const fix = ta('例：回位後先分腿墊步', data.需要修正);
  const note = ta('', data.備註);
  const card = el('div', { class: 'stu' }, [
    el('div', { class: 'stu-head' }, [
      el('b', { text: r.name + (r.level ? '（' + r.level + '）' : '') }),
      el('button', { class: 'link', type: 'button', text: '移除', onclick: () => {
        journal.students = journal.students.filter((x) => x.key !== key);
        card.remove();
        refreshPicker();
      } }),
    ]),
    field('主要問題', problem), field('需要修正', fix),
    field('掌握程度（1＝還不會，5＝很熟練）', mastery), field('程度建議', advice), field('備註', note),
  ]);
  entry.card = card;
  entry.read = () => ({
    紀錄ID: entry.紀錄ID, 學員: entry.學員,
    主要問題: problem.value.trim(), 需要修正: fix.value.trim(), 備註: note.value.trim(),
    掌握程度: checked(mastery)[0] || '', 程度建議: checked(advice)[0] || '',
  });
  $('jf_students').appendChild(card);
}

function field(label, control) {
  return el('div', { class: 'field' }, [el('label', { class: 'title', text: label }), control]);
}

$('btnAddStu').addEventListener('click', () => {
  const id = $('jf_pick').value;
  if (!id) return;
  addStudentCard({ 學員: id });
  refreshPicker();
});

$('btnJournal').addEventListener('click', async () => {
  const j = {
    教學主題: $('jf_topic').value.trim(),
    完成內容: $('jf_done').value.trim(),
    訓練方式: checked($('jf_method'))[0] || '',
    班級整體狀況: $('jf_overall').value.trim(),
    下堂課建議: $('jf_next').value.trim(),
    交接注意事項: $('jf_handover').value.trim(),
    特殊狀況: $('jf_special').value.trim(),
  };
  if (markInvalid('教學主題', !j.教學主題) && !j.教學主題) {
    $('jf_topic').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const sid = journal.sessionId;
  const back = journal.back;
  const r = await send($('btnJournal'), {
    action: 'journalSave', sessionId: sid, submissionId: journal.submissionId,
    journal: j, individuals: journal.students.map((x) => x.read()), returnTo: back.returnTo || 'roster',
  });
  if (!r.ok) {
    if (r.uncertain) return showDone('可能已送出', r.message, back);
    return banner('jf_banner', r.message, true);
  }
  // GAS 已回傳要回去那一頁的資料 → 返回時不必再請求
  forget(['j:' + sid]);
  store.del('v:j:' + sid);
  if (r.data.roster) remember('r:' + sid, Object.assign({ ok: true }, r.data.roster));
  else forget(['r:' + sid]);
  if (r.data.list) remember('jlist', Object.assign({ ok: true }, r.data.list));
  else forget(['jlist']);
  if (r.data.confirmState === 'confirm') {
    const c = r.data.roster && r.data.roster.confirm;
    return showDone(r.data.isNew ? '日誌已送出' : '已儲存修改', '這堂還沒確認上課，確認後系統才會扣堂。',
      { label: '去確認上課', fn: () => openConfirm(sid, back.fn, c) });
  }
  showDone(r.data.isNew ? '日誌已送出' : '已儲存修改', '辛苦了！', journal.back);
});

// ================================================================
const ATTEND_TAG = { 出席: '', 補課出席: '', 請假: '本堂請假', 缺席: '本堂缺席' };

function openRosterList() {
  setBack(null);
  return view('rlist', { action: 'rosterSessions' }, renderRosterList);
}

function renderRosterList(d) {
  setBack(null);
  const list = $('rl_list');
  list.innerHTML = '';
  if (!d.items.length) list.appendChild(el('div', { class: 'empty', text: '前後一週沒有你授課的課堂' }));
  d.items.forEach((s) => list.appendChild(
    sessionItem(s, s.date === d.today ? (s.confirmed ? '今天' : '今天・未點名') : (s.date < d.today && !s.confirmed ? '未點名' : ''), '', () => openRoster(s.id, openRosterList))
  ));
  show('viewRosterList', '課堂學員');
}

// ================================================================
// v4.4：確認上課清單 — 與課堂學員清單同一個請求與快取鍵（rlist），確認上課送出後一起失效
// ================================================================
function openConfirmList() {
  setBack(null);
  return view('rlist', { action: 'rosterSessions' }, renderConfirmList);
}

function renderConfirmList(d) {
  setBack(null);
  const list = $('cl_list');
  list.innerHTML = '';
  // 舊版 GAS 沒有 confirmState：今天以前的課都列出，由確認頁判斷能否修改
  const stateOf = (s) => s.confirmState || (s.date > d.today ? 'future' : s.confirmed ? 'edit' : 'confirm');
  const todo = d.items.filter((s) => stateOf(s) === 'confirm').sort((a, b) => (a.date + a.start < b.date + b.start ? 1 : -1)); // 新的在上
  const done = d.items.filter((s) => stateOf(s) === 'edit').sort((a, b) => (a.date + a.start < b.date + b.start ? 1 : -1));
  const open = (s) => () => openConfirm(s.id, openConfirmList);
  list.appendChild(el('div', { class: 'section-title', text: '待點名' }));
  if (!todo.length) list.appendChild(el('div', { class: 'empty', text: '目前沒有待點名的課 👍' }));
  todo.forEach((s) => list.appendChild(sessionItem(s, s.date === d.today ? '今天' : '未點名', '', open(s))));
  if (done.length) {
    list.appendChild(el('div', { class: 'section-title', text: '已點名，可修改（確認後 ' + (d.editDays || 3) + ' 天內）' }));
    done.forEach((s) => list.appendChild(sessionItem(s, '', '', open(s))));
  }
  show('viewConfirmList', '確認上課');
}

/** back：返回鍵要回到哪裡；從 LINE 卡片直接開啟時沒有返回鍵 */
function openRoster(sessionId, back) {
  return view('r:' + sessionId, { action: 'rosterGet', sessionId: sessionId }, (d) => renderRoster(sessionId, back, d));
}

function renderRoster(sessionId, back, d) {
  const s = d.session;
  const reopen = () => openRoster(sessionId, back);

  $('r_title').textContent = s.dateText + ' ' + s.start + (s.end ? '–' + s.end : '') + '　' + (s.className || '');
  $('r_sub').textContent = [s.tag, s.place || s.venue, s.pendingClass ? '待成班' : '', s.lesson ? '第 ' + s.lesson + ' 堂' : '', '本班已上 ' + d.heldCount + ' 堂'].filter(Boolean).join('・');

  // 上一堂的紀錄
  const prevBox = $('r_prev');
  prevBox.innerHTML = '';
  const p = d.prev;
  if (p && (p.教學主題 || p.下堂課建議 || p.交接注意事項)) {
    const lines = [el('div', { class: 'h', text: '上一堂紀錄・' + p.dateText + (p.coach ? '・' + p.coach : '') })];
    if (p.教學主題) lines.push(el('div', {}, [el('span', { class: 'k', text: '主題　' }), document.createTextNode(p.教學主題)]));
    if (p.下堂課建議) lines.push(el('p', {}, [el('span', { class: 'k', text: '下堂課建議　' }), document.createTextNode(p.下堂課建議)]));
    if (p.交接注意事項) lines.push(el('p', {}, [el('span', { class: 'k', text: '交接注意　' }), document.createTextNode(p.交接注意事項)]));
    prevBox.appendChild(el('div', { class: 'prev' }, lines));
  }

  // 學員卡片
  const canWrite = d.journalState === 'write' || d.journalState === 'edit';
  // 日誌表單、點名的資料已經一起帶來 → 點了直接開，不必請求
  const jf = d.journalForm;
  const formData = jf ? Object.assign({
    session: s,
    roster: d.students.map((x) => ({ id: x.id, name: x.name, level: x.level })),
    confirmState: d.confirmState,
  }, jf) : null;
  const toJournal = (preselect) => openJournalForm(sessionId, {
    preselect: preselect,
    data: formData,
    back: { label: '回到課堂學員', fn: reopen, returnTo: 'roster' },
  });
  $('r_count').textContent = '學員 ' + d.students.length + ' 人' + (d.students.length ? '・點名字展開紀錄' : '');
  const box = $('r_students');
  // 換上新資料時保留已展開的學員
  const opened = new Set(Array.from(box.querySelectorAll('details[open]')).map((x) => x.dataset.id));
  box.innerHTML = '';
  if (!d.students.length) box.appendChild(el('div', { class: 'empty', text: '這一堂目前沒有報名或出缺勤紀錄的學員' }));
  d.students.forEach((st) => {
    const card = studentCard(st, d.noteCount, canWrite ? () => toJournal(st.id) : null);
    if (opened.has(st.id)) card.open = true;
    box.appendChild(card);
  });

  // 底部按鈕：確認上課＋日誌
  const cLabel = { confirm: '確認上課', edit: '修改點名' }[d.confirmState];
  const jLabel = { write: '寫日誌', edit: '修改日誌' }[d.journalState];
  $('btnRosterConfirm').classList.toggle('hidden', !cLabel);
  $('btnRosterJournal').classList.toggle('hidden', !jLabel);
  $('r_barInner').classList.toggle('two', !!(cLabel && jLabel));
  $('r_bar').classList.toggle('hidden', !cLabel && !jLabel);
  if (cLabel) {
    $('btnRosterConfirm').textContent = cLabel;
    $('btnRosterConfirm').className = d.confirmState === 'confirm' ? 'primary' : 'ghost';
    $('btnRosterConfirm').onclick = () => openConfirm(sessionId, reopen, d.confirm);
  }
  if (jLabel) {
    $('btnRosterJournal').textContent = jLabel;
    $('btnRosterJournal').className = cLabel && d.confirmState === 'confirm' ? 'ghost' : 'primary';
    $('btnRosterJournal').onclick = () => toJournal('');
  }
  setBack(back || null);
  show('viewRoster', '課堂學員');
}

function studentCard(st, noteCount, onWrite) {
  const pills = [];
  if (st.makeup) pills.push(el('span', { class: 'pill', text: '補課生' }));
  if (st.age !== '' && st.age !== undefined) pills.push(el('span', { class: 'pill grey', text: st.age + ' 歲' })); // v4.3
  if (st.guardian) pills.push(el('span', { class: 'pill', text: '家長 ' + st.guardian.name })); // v4.3
  if (st.arrivedAt) pills.push(el('span', { class: 'pill ok', text: '已到場 ' + st.arrivedAt }));
  if (ATTEND_TAG[st.thisStatus]) pills.push(el('span', { class: 'pill grey', text: ATTEND_TAG[st.thisStatus] }));
  if (st.advice) pills.push(el('span', { class: 'pill warn', text: st.advice }));
  if (!st.notes.length) pills.push(el('span', { class: 'pill grey', text: '尚無個別紀錄' }));

  const a = st.stats;
  const body = [el('div', { class: 'sc-att', text: '本班出缺勤：出席 ' + a.出席 + '・請假 ' + a.請假 + '・缺席 ' + a.缺席 })];
  // v4.3：被家長代管的學員 → 家長聯絡方式（電話可直接撥打）
  if (st.guardian) {
    const g = st.guardian;
    body.push(el('div', { class: 'sc-att' }, [
      document.createTextNode('家長：' + g.name + (g.rel ? '（' + g.rel + '）' : '') + (g.phone ? '　' : '')),
      g.phone ? el('a', { href: 'tel:' + g.phone, text: g.phone }) : null,
    ]));
  }
  st.notes.forEach((n) => {
    const meta = [n.dateText, n.coach, n.sameClass ? '' : n.className].filter(Boolean).join('・');
    const lines = [el('div', { class: 'm', text: meta })];
    const add = (k, v) => { if (v) lines.push(el('div', { class: 'l' }, [el('b', { text: k + '　' }), document.createTextNode(v)])); };
    add('問題', n.主要問題);
    add('修正', n.需要修正);
    add('掌握', n.掌握程度 ? n.掌握程度 + ' / 5' : '');
    add('建議', n.程度建議);
    add('備註', n.備註);
    body.push(el('div', { class: 'note' }, lines));
  });
  if (st.noteTotal > st.notes.length) {
    body.push(el('div', { class: 'hint', text: '只顯示最近 ' + noteCount + ' 筆，共 ' + st.noteTotal + ' 筆' }));
  }
  if (onWrite) {
    body.push(el('div', { class: 'sc-actions' }, [
      el('button', { class: 'ghost', type: 'button', text: '為這位學員寫紀錄', onclick: onWrite }),
    ]));
  }

  return el('details', { class: 'sc', 'data-id': st.id }, [
    el('summary', {}, [
      el('div', { class: 'sc-top' }, [
        el('span', { class: 'sc-name' }, [document.createTextNode(st.name), st.level ? el('span', { class: 'sc-level', text: st.level }) : null]),
        el('span', { class: 'sc-arrow', text: '›' }),
      ]),
      pills.length ? el('div', { class: 'pills' }, pills) : null,
    ]),
    el('div', { class: 'sc-body' }, body),
  ]);
}

// ================================================================
// 確認上課（點名）
// ================================================================
const CHOICES = ['出席', '請假', '缺席'];
const confirmPage = { sessionId: '', submissionId: '', rows: [], back: null };

/**
 * back：返回鍵與送出後要回到的頁面
 * data：課堂學員頁已經帶來的點名資料（有的話不必請求）
 */
function openConfirm(sessionId, back, data) {
  if (data) {
    app.nav++;
    setStale(false);
    renderConfirm(sessionId, back, data);
    return;
  }
  return view('c:' + sessionId, { action: 'confirmGet', sessionId: sessionId }, (d) => renderConfirm(sessionId, back, d));
}

function renderConfirm(sessionId, back, d) {
  confirmPage.sessionId = sessionId;
  confirmPage.submissionId = newId();
  confirmPage.back = back || null;
  confirmPage.rows = [];

  const s = d.session;
  $('c_title').textContent = s.dateText + ' ' + s.start + (s.end ? '–' + s.end : '') + '　' + (s.className || '');
  $('c_sub').textContent = [s.tag, s.place || s.venue, s.lesson ? '第 ' + s.lesson + ' 堂' : '', '學員 ' + d.students.length + ' 人'].filter(Boolean).join('・');
  banner('c_banner', d.state === 'edit'
    ? '已於 ' + d.confirmedAt + ' 確認上課，可修改至 ' + d.editUntil + '；修改後扣堂紀錄會一併調整。'
    : '', false);
  $('c_hint').textContent = '有掃 QR 簽到的學員已預設為出席。出席' + (d.deductAbsent ? '與缺席' : '') + '會扣一堂，請假不扣；送出後 ' + d.editDays + ' 天內可以修改。';

  const list = $('c_list');
  list.innerHTML = '';
  if (!d.students.length) list.appendChild(el('div', { class: 'empty', text: '這一堂目前沒有報名或出缺勤紀錄的學員' }));
  d.students.forEach((st) => {
    const chips = el('div', { class: 'chips grid3' });
    renderChips(chips, 'c_' + st.id, CHOICES, st.choice ? [st.choice] : [], 'radio');
    const meta = st.arrivedAt ? '已到場 ' + st.arrivedAt : '未簽到';
    const box = el('div', { class: 'att' + (st.choice ? '' : ' unset') }, [
      el('div', { class: 'att-top' }, [
        el('span', { class: 'att-name' }, [
          document.createTextNode(st.name),
          st.level ? el('span', { class: 'sc-level', text: st.level }) : null,
          st.makeup ? el('span', { class: 'sc-level', text: '・補課生' }) : null,
          st.guardian ? el('span', { class: 'sc-level', text: '・家長 ' + st.guardian }) : null,
        ]),
        el('span', { class: 'att-meta' + (st.arrivedAt ? ' in' : ''), text: meta }),
      ]),
      chips,
    ]);
    chips.addEventListener('change', () => { box.classList.toggle('unset', !checked(chips)[0]); updateSummary(); });
    chips.addEventListener('click', () => setTimeout(() => { box.classList.toggle('unset', !checked(chips)[0]); updateSummary(); }, 0));
    confirmPage.rows.push({ id: st.id, chips: chips, box: box });
    list.appendChild(box);
  });
  $('btnAllPresent').classList.toggle('hidden', !d.students.length);
  $('btnConfirm').textContent = d.state === 'edit' ? '儲存修改' : '確認上課';
  $('btnConfirm').disabled = !d.students.length;
  updateSummary();
  setBack(confirmPage.back);
  show('viewConfirm', d.state === 'edit' ? '修改點名' : '確認上課');
}

function updateSummary() {
  const n = { 出席: 0, 請假: 0, 缺席: 0, 未選: 0 };
  confirmPage.rows.forEach((r) => { n[checked(r.chips)[0] || '未選']++; });
  $('c_summary').textContent = '出席 ' + n.出席 + '・請假 ' + n.請假 + '・缺席 ' + n.缺席 + (n.未選 ? '・尚未選擇 ' + n.未選 : '');
}

$('btnAllPresent').addEventListener('click', () => {
  confirmPage.rows.forEach((r) => {
    if (checked(r.chips)[0]) return;
    const input = r.chips.querySelector('input[value="出席"]');
    r.chips.querySelectorAll('input').forEach((x) => (x.dataset.was = ''));
    input.checked = true;
    input.dataset.was = '1';
    r.box.classList.remove('unset');
  });
  updateSummary();
});

$('btnConfirm').addEventListener('click', async () => {
  const items = confirmPage.rows.map((r) => ({ 學員: r.id, 狀態: checked(r.chips)[0] || '' }));
  const firstUnset = confirmPage.rows.find((r) => !checked(r.chips)[0]);
  if (firstUnset) {
    banner('c_banner', '還有學員沒有選擇出缺勤；沒到又沒請假的請選「缺席」。', true);
    firstUnset.box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const sid = confirmPage.sessionId;
  const r = await send($('btnConfirm'), {
    action: 'confirmSave', sessionId: sid, submissionId: confirmPage.submissionId, items: items,
  });
  const next = { label: confirmPage.back === openConfirmList ? '回到確認上課' : '回到課堂學員', fn: confirmPage.back || (() => openRoster(sid, openRosterList)) };
  if (!r.ok) {
    if (r.uncertain) return showDone('可能已送出', r.message, next);
    return banner('c_banner', r.message, true);
  }
  // 回傳的課堂學員資料直接用；清單上的「未點名」標示要重新讀
  forget(['c:' + sid, 'rlist', 'jlist']);
  store.del('v:c:' + sid);
  if (r.data.roster) remember('r:' + sid, Object.assign({ ok: true }, r.data.roster));
  else forget(['r:' + sid]);
  const m = r.data.summary;
  showDone(r.data.isNew ? '已確認上課' : '已儲存修改',
    '出席 ' + m.出席 + '・請假 ' + m.請假 + '・缺席 ' + m.缺席 + '，共扣 ' + m.扣堂 + ' 堂。', next);
});

// ================================================================
// 不可排日期
// ================================================================
const unavail = { submissionId: newId(), today: '' };

function openUnavail() {
  setBack(null);
  return view('unavail', { action: 'unavailList' }, (d) => renderUnavailPage(d));
}

/** warnList：剛新增的不可排日期與已排的課衝突時，列在最上方 */
function renderUnavailPage(d, warnList) {
  setBack(null);
  const w = $('u_warn');
  w.innerHTML = '';
  w.classList.toggle('hidden', !(warnList && warnList.length));
  if (warnList && warnList.length) {
    w.appendChild(el('div', { text: '已登記。這段期間有 ' + warnList.length + ' 堂課排給你，已通知管理員安排代課：' }));
    w.appendChild(el('ul', { class: 'conflict' }, warnList.map((c) =>
      el('li', { text: c.dateText + ' ' + c.start + '　' + c.className + (c.place ? '（' + c.place + '）' : '') }))));
  }
  unavail.today = d.today;
  $('u_start').min = d.today;
  $('u_end').min = d.today;
  if (!$('u_start').value || $('u_start').value < d.today) $('u_start').value = d.today;
  renderUnavail(d.items);
  show('viewUnavail', '不可排日期');
}

function renderUnavail(items) {
  const list = $('u_list');
  list.innerHTML = '';
  if (!items.length) list.appendChild(el('div', { class: 'empty', text: '目前沒有登記' }));
  items.forEach((it) => {
    const range = it.start === it.end ? fmtDay(it.start) : fmtDay(it.start) + ' ～ ' + fmtDay(it.end);
    const del = el('button', { class: 'link', type: 'button', text: '刪除' });
    del.addEventListener('click', async () => {
      if (!confirmInline(del)) return;
      // 先從畫面拿掉，失敗再放回來
      row.style.opacity = '.4';
      del.disabled = true;
      try {
        const r = await callGas({ action: 'unavailDelete', id: it.id });
        if (!r.ok) { alertBox(r.message || '刪除失敗'); del.disabled = false; row.style.opacity = ''; return; }
        const d = Object.assign({ ok: true }, r.list);
        remember('unavail', d);
        renderUnavailPage(d);
      } catch (e) { alertBox('連線不穩定，請稍後再試'); del.disabled = false; row.style.opacity = ''; }
    });
    const row = el('div', { class: 'item' }, [
      el('div', { class: 'top' }, [el('span', { text: range }), del]),
      el('div', { class: 'sub', text: it.reason || '（未填原因）' }),
    ]);
    list.appendChild(row);
  });
}

/** 第一次點「刪除」變成「確定刪除？」，再點一次才刪（避免使用會卡住 LINE 的 confirm 對話框） */
function confirmInline(btn) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1';
  btn.textContent = '確定刪除？';
  setTimeout(() => { btn.dataset.armed = ''; btn.textContent = '刪除'; }, 4000);
  return false;
}

function alertBox(msg) {
  const e = $('u_error');
  e.textContent = msg;
  e.style.display = 'block';
}

function fmtDay(key) {
  const [y, m, d] = key.split('-').map(Number);
  const w = '日一二三四五六'.charAt(new Date(y, m - 1, d).getDay());
  return m + '/' + d + '（' + w + '）';
}

$('btnUnavail').addEventListener('click', async () => {
  const start = $('u_start').value;
  const end = $('u_end').value || start;
  const e = $('u_error');
  e.style.display = 'none';
  if (!start) return alertBox('請選擇開始日期');
  if (start < unavail.today) return alertBox('不能登記今天以前的日期');
  if (end < start) return alertBox('結束日期不能早於開始日期');
  const r = await send($('btnUnavail'), {
    action: 'unavailSave', submissionId: unavail.submissionId, start: start, end: end, reason: $('u_reason').value.trim(),
  });
  if (!r.ok) return alertBox(r.message);
  unavail.submissionId = newId();
  $('u_end').value = '';
  $('u_reason').value = '';
  if (r.data.list) {
    // GAS 已回傳新的清單，不必再請求
    const d = Object.assign({ ok: true }, r.data.list);
    remember('unavail', d);
    renderUnavailPage(d, r.data.conflicts);
  } else {
    forget(['unavail']);
    openUnavail();
  }
});

// ================================================================
// 啟動
// ================================================================
/**
 * 讀取網址參數（page、session）。
 * LINE 開啟 https://liff.line.me/{LIFF ID}?page=journal 時，參數可能出現在兩個地方：
 *   1. 第一次載入：包在 liff.state 裡（?liff.state=%3Fpage%3Djournal）
 *   2. liff.init() 轉址後：直接在網址上（?page=journal）
 * 兩個都讀，避免一律落到預設頁。
 */
function readParams() {
  const out = {};
  const merge = (search) => {
    const p = new URLSearchParams(search);
    p.forEach((v, k) => { if (k !== 'liff.state' && !(k in out)) out[k] = v; });
    const state = p.get('liff.state');
    if (state) {
      const i = state.indexOf('?');
      new URLSearchParams(i >= 0 ? state.slice(i + 1) : state).forEach((v, k) => { if (!(k in out)) out[k] = v; });
    }
  };
  merge(location.search);
  return out;
}

function route(params) {
  app.page = params.page || 'profile';
  if (app.page === 'journal') {
    if (params.session) openJournalForm(params.session); else openJournalList();
  } else if (app.page === 'roster') {
    if (params.session) openRoster(params.session, openRosterList); else openRosterList();
  } else if (app.page === 'confirm' && params.session) {
    openConfirm(params.session, () => openRoster(params.session, openRosterList));
  } else if (app.page === 'confirm') {
    openConfirmList(); // v4.4：選單「確認上課」
  } else if (app.page === 'unavailable') {
    openUnavail();
  } else {
    openProfile();
  }
}

/** LIFF 初始化；完成後換上新的 ID Token 並記下來，下次開啟可以先用 */
async function initLiff() {
  try {
    await sdkReady;
    await liff.init({ liffId: LIFF_ID });
  } catch (e) {
    if (app.early) return toast('LINE 連線異常，如果按鈕沒反應請關閉後重開'); // 舊 Token 還能用，先不擋
    return showError('無法連接 LINE，請從官方帳號的選單開啟。', e.code || e.message);
  }
  if (!liff.isLoggedIn()) {
    liff.login({ redirectUri: location.href });
    return;
  }
  const token = liff.getIDToken();
  if (!token) {
    if (!app.early) showError('無法取得 LINE 身分，請關閉後重新開啟。', 'NO_ID_TOKEN');
    return;
  }
  let exp = 0;
  try { exp = liff.getDecodedIDToken().exp * 1000; } catch (e) { /* 取不到就不保存 */ }
  if (exp) store.set('tok', { token: token, exp: exp });
  app.idToken = token;
  app.early = false;
  readyResolve();
}

function main() {
  const params = readParams();
  // 從選單開啟的第一次載入（網址帶 liff.state）會在 liff.init() 時轉址，這時先不送請求，只畫上次的畫面
  const firstHop = new URLSearchParams(location.search).has('liff.state');
  const token = firstHop ? '' : savedToken();
  if (token) {
    app.idToken = token;
    app.early = true;
  }
  initLiff();
  startBoot(); // v4.5：所有選單頁的資料一次帶回（route 要的頁面直接等它，不另外請求）
  route(params);
}
main();
